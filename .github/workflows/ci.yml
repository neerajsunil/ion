name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  server-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: pip install cargo-zigbuild==0.23.4 ziglang==0.16.0
      - run: |
          cargo zigbuild -p ion_server --release --target x86_64-unknown-linux-musl
          cargo zigbuild -p ion_server --release --target aarch64-unknown-linux-musl
          python scripts/package-server.py --linux-only
      - uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: target/server-dist/*

  windows:
    name: Windows (fmt, clippy, test, build)
    needs: server-assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo lint
      - name: Test
        run: cargo t
      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: target/server-dist
      - name: SSH integration
        run: |
          python -m pip install paramiko==5.0.0
          cargo build -p ion_server
          python scripts/test-server.py target/debug/ion-server.exe
          python scripts/test-ssh.py

      - name: Build
        run: cargo build --workspace

  macos:
    name: macOS (fmt, clippy, test, build)
    needs: server-assets
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo lint
      - name: Test
        run: cargo t
      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: target/server-dist
      - name: SSH integration
        run: |
          python3 -m venv .venv
          .venv/bin/pip install paramiko==5.0.0
          cargo build -p ion_server
          .venv/bin/python scripts/test-server.py target/debug/ion-server
          .venv/bin/python scripts/test-ssh.py

      - name: Build
        run: cargo build --workspace

  layering:
    name: Logic crates stay UI-free
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check that logic crates don't depend on GPUI
        shell: bash
        run: |
          for crate in ion_text ion_project ion_syntax ion_fuzzy ion_git ion_bridge ion_remote_protocol ion_server; do
            if cargo tree -p "$crate" -e normal --prefix none | grep -q '^gpui '; then
              echo "::error::$crate depends on gpui"
              exit 1
            fi
          done

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
