name: Release

# Push a tag `v<workspace version>` (e.g. `v0.2.0`) to build Ion for Windows
# and macOS and publish them as a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Linux and macOS servers: the Linux ones are bundled into the app, the
  # macOS ones are published with the matching server-v* release.
  server-assets:
    uses: ./.github/workflows/server-release.yml
    permissions:
      contents: write

  windows:
    needs: server-assets
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Bundled into ion.exe, so SSH projects work without a download.
      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: target/server-dist
      - name: Build
        # Static C runtime: runs on a clean Windows without the VC++
        # redistributable. RUSTFLAGS replaces .cargo/config.toml's flags, so
        # the CPU target is repeated.
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v2 -C target-feature=+crt-static
        run: cargo build -p ion --release --locked
      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages |
            Where-Object name -eq 'ion' | Select-Object -ExpandProperty version
          $name = "ion-$version-windows-x64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/ion.exe, README.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Copy-Item target/release/ion.exe "dist/$name.exe"
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ion-windows-x64
          path: |
            dist/*.zip
            dist/*.exe

  macos:
    needs: server-assets
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Bundled into the app, so SSH projects work without a download.
      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: target/server-dist
      - name: Build and bundle
        run: scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ion-macos-arm64
          path: dist/*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ion-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          test "$GITHUB_REF_NAME" = "v$VERSION"
          cd dist
          sha256sum *.zip *.exe > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.zip *.exe SHA256SUMS \
            --title "Ion $VERSION" --notes-file ../docs/release-notes.md --latest
