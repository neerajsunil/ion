name: Release

# Push a tag `v<workspace version>` (e.g. `v0.2.0`) to build Ion for Windows
# and publish it as a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: pip install cargo-zigbuild==0.23.4 ziglang==0.16.0
      - run: |
          cargo zigbuild -p ion_server --release --target x86_64-unknown-linux-musl
          cargo zigbuild -p ion_server --release --target aarch64-unknown-linux-musl
          python scripts/package-server.py
      - uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: target/server-dist/*

  windows:
    needs: server-assets
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Bundled into ion.exe, so SSH projects work without a download.
      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: target/server-dist
      - name: Build
        # Static C runtime: runs on a clean Windows without the VC++
        # redistributable. RUSTFLAGS replaces .cargo/config.toml's flags, so
        # the CPU target is repeated.
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v2 -C target-feature=+crt-static
        run: cargo build -p ion --release --locked
      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages |
            Where-Object name -eq 'ion' | Select-Object -ExpandProperty version
          $name = "ion-$version-windows-x64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/ion.exe, README.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Copy-Item target/release/ion.exe "dist/$name.exe"
          Push-Location dist
          Get-FileHash "$name.zip", "$name.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii SHA256SUMS
          Pop-Location
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ion-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          test "$GITHUB_REF_NAME" = "v$VERSION"
          gh release create "$GITHUB_REF_NAME" "dist/$NAME.zip" "dist/$NAME.exe" dist/SHA256SUMS \
            --title "Ion $VERSION" --notes-file docs/release-notes.md --latest
